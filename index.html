<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de la persona Usuaria</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="contenedor-principal">
        <h1 class="titulo-formulario">Registro de la persona Usuaria</h1>
        
        <form action="#" method="post">
            
            <!-- Sección de datos personales -->
            <div class="seccion-formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Escribe tu apellido" required>

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>

                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña" required>
            </div>

            <!-- Sección de descripción personal -->
            <div class="seccion-formulario">
                <label for="descripcion">Breve descripción sobre ti:</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Cuéntanos un poco sobre tus pasatiempos o metas..."></textarea>
            </div>

            <!-- Sección de intereses (Checkboxes) -->
            <div class="seccion-formulario grupo-intereses">
                <p class="subtitulo-seccion">Selecciona tus intereses:</p>
                
                <div class="opcion-check">
                    <input type="checkbox" id="tecnologia" name="intereses" value="Tecnología">
                    <label for="tecnologia">Tecnología</label>
                </div>

                <div class="opcion-check">
                    <input type="checkbox" id="arte" name="intereses" value="Arte">
                    <label for="arte">Arte</label>
                </div>

                <div class="opcion-check">
                    <input type="checkbox" id="deporte" name="intereses" value="Deporte">
                    <label for="deporte">Deporte</label>
                </div>
            </div>

            <!-- Botón de envío -->
            <button type="submit" id="btn-registrar">Registrarse</button>

        </form>
    </div>

</body>
</html>
